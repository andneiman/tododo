# Real simulator screenshots of gestures (swipes etc.), driven by Apple's own UI testing (run by hand).
name: Gesture screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run UI screenshot tests
        run: |
          NAME=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(" | head -1 | sed -E 's/^ *([^(]+) \(.*/\1/' | sed 's/ *$//')
          echo "Simulator: $NAME"
          xcodebuild test -project Tods.xcodeproj -scheme TodsUITests \
            -destination "platform=iOS Simulator,name=$NAME" -resultBundlePath R.xcresult \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || { grep -nE "error|failed|Fail" test.log | head -60; }
          tail -5 test.log
      - name: Export screenshots
        run: |
          mkdir -p out shots
          xcrun xcresulttool export attachments --path R.xcresult --output-path out
          cat out/manifest.json | head -60
          python3 - <<'PY'
          import json, shutil, os
          m = json.load(open('out/manifest.json'))
          for t in m:
              for a in t.get('attachments', []):
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  base = name.split('_')[0] if '_' in name else name
                  shutil.copy(os.path.join('out', a['exportedFileName']), os.path.join('shots', base if base.endswith('.png') else base + '.png'))
          PY
          ls shots
          for f in shots/*.png; do sips -Z 1100 -s format jpeg -s formatOptions 75 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f shots/*.png
      - name: Publish to the ci-swipe branch
        run: |
          cd shots
          git init -q -b ci-swipe
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Gesture screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-swipe
