name: iOS build
on:
  push:
    paths: ["Tododo/**", "Tododo.xcodeproj/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild -project Tododo.xcodeproj -target Tododo -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "warning:|error:" build.log | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -80 build.log
      - name: Launch in simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Tododo.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.andneiman.tododo -demo
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/home.png
          xcrun simctl terminate "$UDID" com.andneiman.tododo
          xcrun simctl launch "$UDID" com.andneiman.tododo -demo -demo-myday
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/myday.png
          for f in shots/*.png; do sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null; done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.jpg
