name: Build
on:
  push:
    paths: ["Tododo/**", "Tododo.xcodeproj/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild -project Tododo.xcodeproj -target Tododo -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "warning:|error:" build.log | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -80 build.log
      - name: Launch in simulator and take screenshots
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/Tododo.app
          mkdir -p shots
          xcrun simctl launch "$UDID" com.andneiman.tododo -demo
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/home.png
          xcrun simctl terminate "$UDID" com.andneiman.tododo
          xcrun simctl launch "$UDID" com.andneiman.tododo -demo -demo-myday
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/myday.png
          for f in shots/*.png; do sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm shots/*.png
      - name: Publish screenshots to the ci-shots branch
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build for macOS
        run: |
          xcodebuild -project Tododo.xcodeproj -target Tododo -sdk macosx \
            -configuration Release build > build.log 2>&1 || true
          grep -E "warning:|error:" build.log | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -80 build.log
      - name: Launch with demo data and take a screenshot
        run: |
          mkdir -p out
          codesign -dv build/Release/Tododo.app 2>&1 | head -5 || true
          lipo -archs build/Release/Tododo.app/Contents/MacOS/Tododo
          # A debug build knows the -demo flag; the release build is what ships.
          xcodebuild -project Tododo.xcodeproj -target Tododo -sdk macosx -configuration Debug build > debug.log 2>&1 || true
          open build/Debug/Tododo.app --args -demo
          sleep 12
          screencapture -x out/mac.png || true
          [ -f out/mac.png ] && sips -Z 1600 -s format jpeg -s formatOptions 70 out/mac.png --out out/mac.jpg >/dev/null && rm out/mac.png
          ditto -c -k --keepParent build/Release/Tododo.app out/Tododo-mac.zip
      - name: Publish the app to the ci-mac branch
        run: |
          cd out
          git init -q -b ci-mac
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "macOS build for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-mac
