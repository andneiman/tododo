name: Build
on:
  push:
    paths: ["Tods/**", "Tods.xcodeproj/**", "Support/**", "scripts/**", "backend/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:
    inputs:
      screens:
        description: "Only these iPhone screens (e.g. 'myday'); empty = full check"
        default: ""
permissions:
  contents: write
jobs:
  # Every push: a quick compile check of both apps on one machine (~5 min).
  quick:
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Tods.xcodeproj -target Tods -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > ios.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" ios.log || { grep -n -B2 -A6 "error:" ios.log | head -100; exit 1; }
      - name: Build for macOS
        run: |
          xcodebuild -project Tods.xcodeproj -target Tods -sdk macosx \
            -configuration Release build > mac.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" mac.log || { grep -n -B2 -A6 "error:" mac.log | head -100; exit 1; }

  # Full check before a release (run by hand): screenshots of every screen, two-app sync test, server tests on Postgres.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          sw_vers -productVersion
          xcodebuild -project Tods.xcodeproj -target Tods -sdk iphonesimulator \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          grep -E "warning:|error:" build.log | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -80 build.log
      - name: Screenshots of every screen
        env:
          SCREENS: ${{ inputs.screens }}
        run: |
          mkdir -p shots
          shoot() { # name-prefix, simulator udid
            xcrun simctl boot "$2" || true
            xcrun simctl bootstatus "$2" -b
            xcrun simctl install "$2" build/Debug-iphonesimulator/Tods.app
            for screen in ${SCREENS:-home myday list detail section settings search empty lock}; do
              xcrun simctl terminate "$2" com.andneiman.tododo 2>/dev/null || true
              xcrun simctl launch "$2" com.andneiman.tododo -demo YES -demoScreen $screen
              sleep 6
              xcrun simctl io "$2" screenshot "shots/$1-$screen.png"
            done
            xcrun simctl shutdown "$2" || true
          }
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -30
          BIG=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9] Pro \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          SMALL=$(xcrun simctl list devices available | grep -E "iPhone SE|iPhone 1[6-7]e" | head -1 | grep -oE "[0-9A-F-]{36}")
          shoot iphone "$BIG"
          if [ -n "$SMALL" ] && [ -z "$SCREENS" ]; then shoot se "$SMALL"; fi
          for f in shots/*.png; do sips -Z 1100 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm shots/*.png
      - name: Publish screenshots to the ci-shots branch
        run: |
          cd shots
          git init -q -b ci-shots
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.screens == ''
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build for macOS (release)
        run: |
          xcodebuild -project Tods.xcodeproj -target Tods -sdk macosx \
            -configuration Release build > build.log 2>&1 || true
          grep -E "warning:|error:" build.log | sort -u | head -60 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build for macOS (debug, through the shared scheme)
        run: |
          xcodebuild -project Tods.xcodeproj -scheme Tods -destination 'platform=macOS' \
            -configuration Debug -derivedDataPath dd build > debug.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" debug.log
      - name: Errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log debug.log | head -200 || tail -80 debug.log
      - name: Screenshots of every screen
        if: always()
        run: |
          mkdir -p out
          for screen in myday list detail settings search empty lock; do
            pkill -x Tods 2>/dev/null || true
            sleep 1
            rm -rf ~/Library/Saved\ Application\ State/com.andneiman.tododo.savedState
            open dd/Build/Products/Debug/Tods.app --args -demo YES -demoScreen $screen -ApplePersistenceIgnoreState YES
            sleep 7
            screencapture -x "out/mac-$screen.png" || true
          done
          pkill -x Tods 2>/dev/null || true
          # Apple's own apps on the same system, for visual reference.
          for app in Reminders Notes; do
            open -a "$app" || true
            sleep 10
            screencapture -x "out/ref-$app.png" || true
            osascript -e "quit app \"$app\"" || true
          done
          for f in out/*.png; do sips -Z 1600 -s format jpeg -s formatOptions 70 "$f" --out "${f%.png}.jpg" >/dev/null; done
          rm -f out/*.png
          [ -d build/Release/Tods.app ] && ditto -c -k --keepParent build/Release/Tods.app out/Tods-mac.zip
      - name: End-to-end sync test (two app processes against a local server)
        run: |
          mkdir -p out
          set -o pipefail
          scripts/e2e.sh "$PWD/dd/Build/Products/Debug/Tods.app/Contents/MacOS/Tods" 2>&1 | tee out/e2e.txt
      - name: Server tests on Postgres
        if: always()
        run: |
          brew list postgresql@16 >/dev/null 2>&1 || brew install postgresql@16 >/dev/null 2>&1 || true
          PGBIN="$(brew --prefix postgresql@16)/bin"
          "$PGBIN/initdb" -D /tmp/pgd -A trust >/dev/null && "$PGBIN/pg_ctl" -D /tmp/pgd -o "-p 5544" -l /tmp/pg.log start >/dev/null
          sleep 2 && "$PGBIN/createdb" -p 5544 t
          cd backend && npm ci --silent
          rm -f /tmp/seed.json
          TODODO_LOCAL_FILE=/tmp/seed.json node test/sync.test.mjs seed
          TODODO_LOCAL_FILE=/tmp/seed.json DATABASE_URL="postgres://$USER@localhost:5544/t" node test/sync.test.mjs run 2>&1 | tee ../out/server-tests.txt
      - name: Publish the app and reports to the ci-mac branch
        if: always()
        run: |
          cd out
          git init -q -b ci-mac
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add . && git commit -q -m "macOS build for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-mac
